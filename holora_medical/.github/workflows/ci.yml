name: CI — Lint & Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Build production
        run: npm run build
        env:
          VITE_API_URL: http://localhost:5002
          VITE_GOOGLE_CLIENT_ID: ""

  image-processing:
    name: Python Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip setuptools pip-audit
      - run: python -m pip install -r image-processing/requirements.txt
      - run: python -m pip check
      - run: python -m pip_audit --progress-spinner off
      - run: python -m compileall -q image-processing/app
