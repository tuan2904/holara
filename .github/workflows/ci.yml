name: CI — Lint & Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  laravel:
    name: Laravel Regression Tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-test-only
          MYSQL_DATABASE: medecode_test
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-test-only" --health-interval=10s --health-retries=15
    env:
      DB_HOST: 127.0.0.1
      DB_USERNAME: root
      DB_PASSWORD: ci-test-only
      DB_DATABASE: medecode_test
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, mbstring, dom
          tools: composer
      - run: composer install --no-interaction --prefer-dist
        working-directory: laravel-backend
      - name: Import synthetic test schema only
        run: mysql -h 127.0.0.1 -uroot -pci-test-only medecode_test < holora_medical.sql
      - run: vendor/bin/phpunit
        working-directory: laravel-backend
      - run: composer audit
        working-directory: laravel-backend
  frontend:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Build production
        run: npm run build
        env:
          VITE_API_URL: http://localhost:15002
          VITE_GOOGLE_CLIENT_ID: ""

  image-processing:
    name: Python Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip setuptools pip-audit
      - run: python -m pip install -r image-processing/requirements.txt
      - run: python -m pip check
      - run: python -m pip_audit --progress-spinner off
      - run: python -m compileall -q image-processing/app
